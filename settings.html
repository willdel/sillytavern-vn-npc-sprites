<div id="vn-npc-sprites-settings" class="vn-npc-settings extension_container">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>VN NPC Sprites</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <label class="checkbox_label" for="vn_npc_enabled">
        <input id="vn_npc_enabled" type="checkbox">
        <span>Enable NPC sprite routing</span>
      </label>
      <div class="vn-npc-roster-panel">
        <b>Current scene</b>
        <div id="vn_npc_roster">No tracked characters.</div>
        <select id="vn_npc_character" class="text_pole"></select>
      </div>
      <label for="vn_npc_fallback">Preferred fallback sprite label</label>
      <input id="vn_npc_fallback" class="text_pole" type="text" placeholder="neutral">
      <label class="checkbox_label" for="vn_npc_expressions_enabled">
        <input id="vn_npc_expressions_enabled" type="checkbox">
        <span>Use the Character Expressions classifier</span>
      </label>
      <label for="vn_npc_aliases">Aliases (one per line: Alias = Card Name)</label>
      <textarea id="vn_npc_aliases" class="text_pole" rows="4" placeholder="Ms. Carter = Shannon"></textarea>
      <label class="checkbox_label" for="vn_npc_actions_enabled">
        <input id="vn_npc_actions_enabled" type="checkbox">
        <span>Enable action sprite tracking</span>
      </label>
      <label for="vn_npc_action_definitions">Actions (action | temporary/persistent | priority = trigger phrases)</label>
      <textarea id="vn_npc_action_definitions" class="text_pole" rows="9"></textarea>
      <label class="checkbox_label" for="vn_npc_backgrounds_enabled">
        <input id="vn_npc_backgrounds_enabled" type="checkbox">
        <span>Automatically select backgrounds from the Location header</span>
      </label>
      <label for="vn_npc_background_mappings">Backgrounds (Location = uploaded background filename)</label>
      <textarea id="vn_npc_background_mappings" class="text_pole" rows="6" placeholder="Bedroom = bedroom.webp&#10;Driftline Beach - North Cove Path = north-cove.webp"></textarea>
      <small>Matching is exact (ignoring capitalization, extra spaces, and dash style). Unmatched locations keep the current background.</small>
      <div class="vn-npc-actions">
        <button id="vn_npc_test" class="menu_button" type="button">Test latest AI message</button>
        <button id="vn_npc_add" class="menu_button" type="button">Add to scene</button>
        <button id="vn_npc_remove" class="menu_button" type="button">Remove from scene</button>
        <button id="vn_npc_reset_action" class="menu_button" type="button">Reset action</button>
        <button id="vn_npc_clear" class="menu_button" type="button">Clear scene</button>
      </div>
      <small id="vn_npc_status">Waiting for an AI message.</small>
      <small>Expression classification uses the API selected in SillyTavern's Character Expressions settings.</small>
    </div>
  </div>
</div>
